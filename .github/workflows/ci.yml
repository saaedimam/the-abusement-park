name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run essential checks
        run: npm run check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Browser regression (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright shard
        run: npm run test:e2e -- --shard=${{ matrix.shard }}

      # Cloudflare's immutable preview hostname is a deployment id, not the git SHA.
      # Resolving that id needs the Cloudflare API, and this workflow has no Cloudflare credentials.
      # The old branch-alias URL (https://<branch>.<project>.pages.dev) is mutable and can 404 or
      # serve a different commit, so it is not a reliable target. Set the SMOKE_BASE_URL repository
      # variable to the immutable deployment URL when a credentialed lookup is available.
      - name: Run Cloudflare preview smoke
        if: matrix.shard == '1/2' && github.event_name == 'pull_request'
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: |
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "Skipping deployed preview smoke."
            echo "No immutable Cloudflare deployment URL is available without API credentials."
            echo "Set the SMOKE_BASE_URL repository variable to the deployment URL for this commit to enable it."
            exit 0
          fi
          npm run test:smoke

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
